# Deployment da API (CONTRATOS §1 e §5): 3 réplicas, espera o Postgres,
# lê ConfigMap/Secret, tem probes, limites de recursos e rolling update sem downtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ha-demo
  labels: { app: api }
spec:
  replicas: 3                         # [OBRIGATÓRIO]
  selector:
    matchLabels: { app: api }         # == template.metadata.labels == selector do Service
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } # só derruba um pod antigo quando o novo está Ready
  template:
    metadata:
      labels: { app: api }
    spec:
      initContainers:
        - name: wait-for-postgres     # dependência API → banco (o K8s não tem depends_on)
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z postgres 5432; do echo aguardando postgres; sleep 2; done"]
      containers:
        - name: api
          image: api:1.3              # código da #20 (banco) + #24 (crash/cpu)
          imagePullPolicy: IfNotPresent # imagem local do Minikube, não baixa do Docker Hub
          ports: [{ containerPort: 8080 }]
          envFrom:                    # APP_* e DB_HOST/PORT/NAME do ConfigMap, DB_USER/PASSWORD do Secret
            - configMapRef: { name: api-config }
            - secretRef:    { name: db-credentials }
          env:                        # Downward API: o pod descobre quem ele é
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_IP,   valueFrom: { fieldRef: { fieldPath: status.podIP } } }
            - { name: NODE_NAME, valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
          resources:                  # viram limites de cgroup no nó; requests também é base do HPA
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          readinessProbe:             # tira o pod do Service enquanto não está pronto (não consulta o banco)
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:              # 3 falhas seguidas (~15 s) e o kubelet reinicia o container
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
