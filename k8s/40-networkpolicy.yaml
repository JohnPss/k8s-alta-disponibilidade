# NetworkPolicy do PostgreSQL (CONTRATOS §1): isola o banco na rede.
# Permite tráfego Ingress na porta TCP 5432 exclusivamente a partir de pods com label app: api.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-allow-api
  namespace: ha-demo
  labels:
    app: postgres
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 5432
