apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ha-demo
  labels:
    app: postgres
spec:
  serviceName: "postgres"
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: postgres
          # NOTA (Segurança / AUD-12): securityContext (runAsNonRoot/allowPrivilegeEscalation/fsGroup)
          # intencionalmente não aplicado: o entrypoint oficial precisa de root inicial para
          # ajustar permissões (0700) e executar su-exec no volume minikube-hostpath sem quebrar o initdb.
          #
          # IMPORTANTE (Credenciais x PVC): As variáveis POSTGRES_USER, POSTGRES_PASSWORD
          # e POSTGRES_DB só têm efeito na inicialização inicial do banco (initdb).
          # Como os dados persistem no volume 'data' (PVC data-postgres-0), alterar
          # Secret ou ConfigMap posteriormente não altera as credenciais de um banco já
          # inicializado. Para atualizar credenciais, altere a senha via SQL no banco
          # ou remova o PVC data-postgres-0 para recriar os dados.
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: DB_NAME
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
